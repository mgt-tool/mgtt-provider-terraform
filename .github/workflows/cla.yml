# Asks first-time contributors to sign CLA.md, and records the signature in
# this repository on the `cla-signatures` branch.
#
# Needs a repo secret `PERSONAL_ACCESS_TOKEN` (a classic PAT with `repo`
# scope) so the action can write the signature file. Until that secret
# exists the job fails on external pull requests — which blocks unsigned
# contributions, the intended behaviour.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          path-to-signatures: signatures/version1/cla.json
          branch: cla-signatures
          allowlist: sajonaro,bot*
          custom-notsigned-prcomment: >
            Thanks for the pull request. Before it can be merged, please read
            **[CLA.md](https://github.com/${{ github.repository }}/blob/main/CLA.md)**
            and post the comment below. You keep the copyright in your work;
            signing once covers everything you contribute here.
